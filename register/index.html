<body>

<div id="toast-container"></div>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
  <div class="logo">
    <a href="/" class="logo-brand">
      <img src="/logo-icon.svg" alt="MayankZen Studios Emblem" class="brand-logo-img" width="40" height="40">
      <span class="brand-text">MayankZen <span class="brand-sub">Studio</span></span>
    </a>
  </div>
  <nav>
    <ul id="navMenu">
      <li><a href="/">Home</a></li>
      <li><a href="/#services">Services</a></li>
      <li><a href="/#portfolio">Projects</a></li>
      <li><a href="/request/">Request</a></li>
      <li><a href="/track/">Track</a></li>
      <li><a href="/login/" class="auth-link">Login</a></li>
      <li><a href="/register/" class="auth-link" style="color: var(--accent-green); font-weight: bold;">Register</a></li>
    </ul>
  </nav>
  <button class="menu-toggle" id="menuBtn" aria-label="Toggle navigation menu">☰</button>
</header>

<main class="auth-container">
  <div class="auth-card" style="text-align: left;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 55px; height: 55px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: var(--accent-green); font-size: 1.5rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 style="color: var(--primary-purple); font-size: 1.8rem; margin-bottom: 0.25rem;">Create Client Account</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Join MayankZen Studios client portal</p>
    </div>

    <form onsubmit="return false;">
      <div class="form-group">
        <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
        <input type="text" id="name" placeholder="Mayank Kumar" required>
      </div>

      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-key"></i> Password (min 6 characters)</label>
        <input type="password" id="password" placeholder="••••••••" minlength="6" required>
      </div>

      <button type="button" id="registerBtn" class="btn primary" style="width: 100%; border: none; cursor: pointer; padding: 0.9rem; font-size: 1rem; margin-top: 0.5rem;">
        Create Account
      </button>

      <div style="display: flex; align-items: center; margin: 1.5rem 0; color: var(--text-secondary); font-size: 0.85rem;">
        <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
        <span style="padding: 0 10px;">or quick join with</span>
        <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
      </div>

      <button type="button" id="googleLoginBtn" class="btn secondary" style="width: 100%; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; padding: 0.85rem; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i> Sign up with Google
      </button>
    </form>

    <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
      Already have an account? <a href="/login/" style="color: var(--accent-green); font-weight: 600; text-decoration: none;">Sign In</a>
    </p>
  </div>
</main>

<footer>
  <p>© 2026 MayankZen Studios | Building Digital Worlds. All rights reserved.</p>
</footer>

<script type="module" src="../script.js"></script>
<script type="module" src="../auth.js"></script>
</body>
</html>
